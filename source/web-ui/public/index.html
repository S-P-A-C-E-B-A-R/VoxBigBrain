<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VoxBigBrain</title>
  <link rel="stylesheet" href="/styles.css?v=5">
</head>
<body>
  <main id="app">
    <header><div class="account"><div><h1>VoxBigBrain</h1><div class="subtitle">Local LLM speech terminal</div></div><div><span id="username"></span><button id="logout" class="quiet">Logout</button></div></div><div id="status">Initializing...</div></header>
    <div id="controls"><button id="sessionToggle" class="icon-button" disabled aria-label="Connect" title="Connect"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg></button><button id="mute" class="icon-button" disabled aria-label="Mute microphone" title="Mute microphone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 10v1a6 6 0 0 0 12 0v-1M12 17v4M8 21h8"/></svg></button><button id="newChat" class="icon-button" aria-label="New chat" title="New chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><div id="soundControl"><label for="uiSoundVolume" title="UI sound volume"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10zM16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg><span class="sr-only">UI sound volume</span></label><input id="uiSoundVolume" type="range" min="0" max="1" step="0.05" aria-label="UI sound volume" title="UI sound volume"><output id="uiSoundVolumeValue" for="uiSoundVolume"></output></div></div>
    <section id="conversationPanel"><div class="label">Conversation</div><div id="transcript"><div id="emptyTranscript">Speech transcription will appear here.</div></div></section>
    <details id="logPanel"><summary>Event Log</summary><div id="log"></div></details>
    <details id="savedPanel"><summary>Saved Chats</summary><div id="savedList"></div></details>
    <footer><div id="sessionMeta">No active session</div><div id="transportMeta">Web interface</div></footer>
  </main>
  <script src="/livekit-client.js"></script>
  <script src="/voice-session.js?v=5" type="module"></script>
  <script src="/app.js?v=6" type="module"></script>
</body>
</html>
